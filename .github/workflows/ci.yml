name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web unit tests
        run: npm test
        working-directory: apps/web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and compile Python
        run: |
          pip install --quiet ruff==0.8.4
          ruff check demo audit/runtime alerts
          ruff format --check demo alerts
          python -m py_compile demo/seed.py audit/runtime/smoke.py alerts/notify.py
      - name: Alerter unit tests
        run: python -m unittest discover alerts
      - name: NGINX config syntax
        run: docker run --rm --add-host api:127.0.0.1 -v "$PWD/apps/web/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine@sha256:8eb2b5540eae779603cc3db84b3986a15ecb5308b54303146eee9837c137b51a nginx -t

  stack:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    defaults:
      run:
        working-directory: audit/runtime
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start Marquez, PostgreSQL and NGINX
        run: |
          (umask 077; printf 'NEXUS_MARQUEZ_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env)
          docker compose up --detach --wait --wait-timeout 300
      - name: Smoke test
        run: python smoke.py
      - name: Seed demo twice; the second run must post nothing
        run: |
          python ../../demo/seed.py
          python ../../demo/seed.py 2>&1 | tee second-run.log
          grep -q "^Posted 0 events" second-run.log
      - name: Run the dbt jaffle_shop pipeline with OpenLineage
        run: |
          pip install --quiet -r ../../pipelines/requirements.txt
          ../../pipelines/run_dbt.sh http://localhost:15000
      - name: Alerter dry run must report the demo failures
        run: |
          python ../../alerts/notify.py --dry-run | tee alert.txt
          grep -q "2 failing jobs, 1 failed check" alert.txt
      - name: Browser check and screenshots
        working-directory: apps/web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
          node e2e/browser.mjs --out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: apps/web/screenshots
          if-no-files-found: ignore
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 120 db api web
