<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Nexus data lineage and pipeline operations workspace.">
    <title>Nexus | Lineage workspace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/nexus.css">

    <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

      <a class="brand" href="#overview"><img src="/favicon.svg" alt="" width="28" height="28">Nexus</a>
      <p class="nav-label" data-i18n="nav.section">Workspace</p>
      <nav aria-label="Main navigation">
        <a href="#overview"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span><span data-i18n="nav.overview">Overview</span></a>
        <a href="#jobs"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M7 10v4a3 3 0 0 0 3 3h4"/></svg></span><span data-i18n="nav.jobs">Jobs</span></a>
        <a href="#datasets"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span><span data-i18n="nav.datasets">Datasets</span></a>

      </nav>
      <div class="sidebar-foot">
        <div class="lang" role="group" aria-label="Language / Язык">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ru">RU</button>
        </div>
        <a class="about-link" href="#about" data-i18n="nav.about">About Nexus</a>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <header class="toolbar">
        <form class="search" role="search">
          <input id="search" name="q" type="search" autocomplete="off" data-i18n-placeholder="search.placeholder" placeholder="Search jobs and datasets…">
        </form>
        <span id="connection" class="connection" role="status">Connecting</span>
      </header>
      <header class="page-heading">
        <h1 id="page-title">Operations overview</h1>
        <p id="page-subtitle" class="subtitle"></p>
      </header>
      <div id="content" aria-busy="true"><p>Loading workspace…</p></div>
