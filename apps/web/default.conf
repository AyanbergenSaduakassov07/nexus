server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthcheck {
        return 200 "OK";
    }

    location /api/v1/ {
        # The workspace reads metadata. Producers ingest through the API port.
        limit_except GET {
            deny all;
        }
        proxy_pass http://api:5000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
